
title: "&f<shift:-8><image:miragedge_menu:aiyasbus_item_check>"

shape:
  - 'EEEEEE BC'
  - 'EEEEEE   '
  - 'EEEEEE I '
  - 'EEEEEE   '
  - 'EEEEEE M '
  - 'PP  NN   '

template:
  'B':
    material: PAPER
    custom-model-data: 233
    name: "&b返回 {last}"
    feature:
      - ==: Functional
        keyword: Back

  'C':
    material: PAPER
    custom-model-data: 233
    name: "&c关闭"
    feature:
      - ==: Close

  'P':
    material: PAPER
    custom-model-data: 233
    name: "&e上一页"
    feature:
      - ==: Functional
        keyword: Previous

  'N':
    material: PAPER
    custom-model-data: 233
    name: "&e下一页"
    feature:
      - ==: Functional
        keyword: Next

  'E':
    material: PLAYER_HEAD
    name: "{enchant_display_lore}"
    lore:
      - "&8| &7附魔 > {enchant_display}"
      - "&8| &7等级 > &e{level} / &c{max_level}"
      - "&8| &7品质 > {rarity_display}"
      - "&8| &7简介 > {description}"
      - "&7"
      - "&8| &7点击查看详细信息"
    feature:
      - ==: Functional
        keyword: ItemCheck:enchant

  'I':
    material: PLAYER_HEAD
    name: "&e待选择"
    lore:
      - "&8| &7点击背包内物品即可"
      - "&8| &7{mode}"
    feature:
      - ==: Head
        texture: "eyJ0ZX...9fX0="
      - ==: Functional
        keyword: ItemCheck:item

  'M':
    material: PAPER
    custom-model-data: 233
    name: "&b查询模式"
    lore:
      - "&8| &7点击即可切换模式"
      - "      &7> {modes}"
    feature:
      - ==: Functional
        keyword: ItemCheck:mode
