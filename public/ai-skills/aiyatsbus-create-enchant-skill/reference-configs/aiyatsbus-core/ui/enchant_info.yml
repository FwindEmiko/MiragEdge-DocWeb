
title: "&f<shift:-8><image:miragedge_menu:aiyatsbus_enchant_info>"

shape:
  - 'SSDDGG BC'
  - 'EEEEEE   '
  - 'EEEEEE I '
  - 'EEEEEE   '
  - 'EEEEEEXZY'
  - 'PPLLNNKJM'

template:
  'C':
    material: PAPER
    custom-model-data: 233
    name: "&c关闭"
    feature:
      - ==: Close

  'B':
    material: PAPER
    custom-model-data: 233
    name: "&b返回 {last}"
    feature:
      - ==: Functional
        keyword: Back

  'P':
    material: PAPER
    custom-model-data: 233
    name: "&e上一页"
    feature:
      - ==: Functional
        keyword: Previous

  'N':
    material: PAPER
    custom-model-data: 233
    name: "&e下一页"
    feature:
      - ==: Functional
        keyword: Next

  'L':
    material: PAPER
    custom-model-data: 233
    name: "&b收藏夹"
    lore:
      - "&8| &7记不清楚想要什么附魔？"
      - "&8| &7把它们收集起来，方便查阅"
      - "&8| &7"
      - "&8| &7点击按钮将{state}"
    feature:
      - ==: Functional
        keyword: EnchantInfo:favorite

  'E':
    material: PLAYER_HEAD
    feature:
      - ==: Functional
        keyword: EnchantInfo:element
        group_name: "&e{group} &7(&a{amount}&7)"
        enchant_name: "{enchant_display_lore}"
        group_lore:
          - "&8| &7最大共存数 > &c{max_coexist}"
          - "&8| &7点击查看该分组下的所有附魔"
        enchant_lore:
          - "&8| &7附魔 > {enchant_display}"
          - "&8| &7等级 > &e{level} / &c{max_level}"
          - "&8| &7品质 > {rarity_display}"
          - "&8| &7简介 > {description}"
          - "&7"
          - "&8| &7点击查看详细信息"

  'S':
    material: PAPER
    custom-model-data: 233
    name: "&c冲突"
    lore:
      - "&8| &7点击在下方显示与"
      - "&8| &7本附魔冲突的附魔"
    feature:
      - ==: Functional
        keyword: EnchantInfo:conflicts

  'D':
    material: PAPER
    custom-model-data: 233
    name: "&a依赖"
    lore:
      - "&8| &7点击在下方显示与"
      - "&8| &7本附魔依赖的附魔"
    feature:
      - ==: Functional
        keyword: EnchantInfo:dependencies

  'G':
    material: PAPER
    custom-model-data: 233
    name: "&e相关"
    lore:
      - "&8| &7点击在下方显示与"
      - "&8| &7本附魔同分类的附魔"
    feature:
      - ==: Functional
        keyword: EnchantInfo:related

  'Z':
    material: ENCHANTED_BOOK
    name: "&7等级数据 &a{roman}"
    lore:
      - "&8| &7{params}"
      - "&7"
      - "&8| &7&c点击&7按钮还原至最大级"
    feature:
      - ==: Functional
        keyword: EnchantInfo:level

  'X':
    material: PAPER
    custom-model-data: 233
    name: "&c-1"
    lore:
      - "&8| &7&c点击&7按钮使查询等级&c-1级"
    feature:
      - ==: Functional
        keyword: EnchantInfo:minus

  'Y':
    material: PAPER
    custom-model-data: 233
    name: "&a+1"
    lore:
      - "&8| &7&a点击&7按钮使查询等级&a+1级"
    feature:
      - ==: Functional
        keyword: EnchantInfo:plus

  'I':
    material: PLAYER_HEAD
    name: "{enchant_display_lore}"
    lore:
      - "&8| &7附魔 > {enchant_display}"
      - "&8| &7等级 > &e{level} / &c{max_level}"
      - "&8| &7品质 > {rarity_display}"
      - "&8| &7简介 > {description}"
    feature:
      - ==: Functional
        keyword: EnchantInfo:basic

  'J':
    material: PAPER
    custom-model-data: 233
    name: "&6限制"
    lore:
      - "&8| &7对象 > {targets}"
      - "&8| &7位置 > {active_slots}"
      - "&8| &7冲突 > {conflicts}"
      - "&8| &7依赖 > {dependencies}"
      - "&8| &7权限 > {permission}"
      - "&8| &7禁用世界 > {disable_worlds}"
    feature:
      - ==: Functional
        keyword: EnchantInfo:limitations

  'K':
    material: PAPER
    custom-model-data: 233
    name: "&e其他属性"
    lore:
      - "&8| &7获取 > {attain_ways}"
      - "&8| &7磨砂 > {grindstoneable}"
      - "&8| &7宝藏 > {treasure}"
      - "&8| &7诅咒 > {curse}"
    feature:
      - ==: Functional
        keyword: EnchantInfo:other

  'M':
    material: PAPER
    custom-model-data: 233
    name: "&e物品检测"
    lore:
      - "&8| &7点击背包内的一个物品"
      - "&8| &7检测本附魔是否可安装"
      - "&7"
      - "&8| &7状态 > {state}"
      - "&8| &7原因 > {reasons}"
    feature:
      - ==: Functional
        keyword: EnchantInfo:available
