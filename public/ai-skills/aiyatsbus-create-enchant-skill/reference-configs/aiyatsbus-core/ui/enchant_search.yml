
title: "&f<shift:-8><image:miragedge_menu:aiyatsbus_enchant_search>"

shape:
  - 'EEEEEE BC'
  - 'EEEEEEZZZ'
  - 'EEEEEEYYY'
  - 'EEEEEEXXX'
  - 'EEEEEEWWW'
  - 'PP  NN   '

template:
  'C':
    material: PAPER
    custom-model-data: 233
    name: "&c关闭"
    feature:
      - ==: Close

  'B':
    material: PAPER
    custom-model-data: 233
    name: "&b返回 {last}"
    feature:
      - ==: Functional
        keyword: Back

  'P':
    material: PAPER
    custom-model-data: 233
    name: "&e上一页"
    feature:
      - ==: Functional
        keyword: Previous

  'N':
    material: PAPER
    custom-model-data: 233
    name: "&e下一页"
    feature:
      - ==: Functional
        keyword: Next

  'W':
    material: PAPER
    custom-model-data: 233
    name: "&b筛选 &7>> &e按品质"
    lore:
      - "&8| &7当前筛选的品质 > "
      - "&7    {rarities}"
      - "&7"
      - "&8| &7点击选择显示或不显示特定品质的附魔"
      - "&8| &7Shift + 点击清除当前筛选"
    feature:
      - ==: Functional
        keyword: EnchantSearch:filter_rarity

  'X':
    material: PAPER
    custom-model-data: 233
    name: "&b筛选 &7>> &e按物品类别"
    lore:
      - "&8| &7当前筛选的物品类别 > "
      - "&7    {targets}"
      - "&7"
      - "&8| &7点击选择显示或不显示特定物品类别的附魔"
      - "&8| &7Shift + 点击清除当前筛选"
    feature:
      - ==: Functional
        keyword: EnchantSearch:filter_target

  'Y':
    material: PAPER
    custom-model-data: 233
    name: "&b筛选 &7>> &e按类型/定位"
    lore:
      - "&8| &7当前筛选的类型/定位 > "
      - "&7    {groups}"
      - "&7"
      - "&8| &7点击选择显示或不显示特定类型/定位的附魔"
      - "&8| &7Shift + 点击清除当前筛选"
    feature:
      - ==: Functional
        keyword: EnchantSearch:filter_group

  'Z':
    material: PAPER
    custom-model-data: 233
    name: "&b筛选 &7>> &e按名字/描述"
    lore:
      - "&8| &7当前筛选的名字/描述 > "
      - "&7    {strings}"
      - "&7"
      - "&8| &7左击 &a✓只看含有特定字段的附魔"
      - "&8| &7Shift + 点击 &e੦清除当前筛选"
      - "&8| &7右击 &c✗不看含有特定字段的附魔"
    feature:
      - ==: Functional
        keyword: EnchantSearch:filter_string

  'E':
    material: PLAYER_HEAD
    name: "{enchant_display_lore}"
    lore:
      - "&8| &7附魔 > {enchant_display}"
      - "&8| &7等级 > &e{level} / &c{max_level}"
      - "&8| &7品质 > {rarity_display}"
      - "&8| &7简介 > {description}"
      - "&7"
      - "&8| &7点击查看详细信息"
    feature:
      - ==: Functional
        keyword: EnchantSearch:enchant
