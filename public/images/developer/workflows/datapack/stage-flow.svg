<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img">
  <title>数据包工作流的四个阶段循环图</title>
  <desc>四个阶段自上而下：编写（函数、战利品表、配方、生物、结构）、校验（/reload、/function、日志）、部署（datapacks/ 与版本锁定）、回滚（保留上一版可加载包）。回滚后沿右侧虚线回到编写，形成循环。</desc>
  <defs>
    <style>
            /* 由 img 元素加载，页面 CSS 不级联；配色固定浅色一套 + 自带白色背景，
         不依赖 prefers-color-scheme（站点用 html.dark 切换，不会触发它）。 */
      :root {
        --d-text-1: var(--vp-c-text-1, #3c3c43);
        --d-text-2: var(--vp-c-text-2, #6b6b70);
        --d-text-3: var(--vp-c-text-3, #8e8e93);
        --d-line:   var(--vp-c-divider, #e2e2e4);
        --d-panel:  var(--vp-c-bg, #ffffff);
        --d-band:   var(--vp-c-bg-alt, #f6f6f7);
        --d-soft:   var(--vp-c-bg-soft, #f6f6f7);
        --d-brand:  var(--vp-c-brand-1, #e05252);
      }
      
      text { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; }
      .h { font-size: 15px; font-weight: 600; fill: var(--d-text-1); }
      .t { font-size: 14px; font-weight: 600; fill: var(--d-text-1); }
      .d { font-size: 12.5px; fill: var(--d-text-2); }
      .m { font-size: 12.5px; fill: var(--d-text-3); }
      .a { font-size: 12.5px; font-weight: 600; fill: var(--d-brand); }
      .n { font-size: 13px; font-weight: 700; fill: var(--d-brand); }
      .p { font-size: 12.5px; fill: var(--d-text-2);
           font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; }
      .box   { fill: var(--d-panel); stroke: var(--d-line); stroke-width: 1.5; }
      .band  { fill: var(--d-band);  stroke: var(--d-line); stroke-width: 1; }
      .soft  { fill: var(--d-soft);  stroke: var(--d-line); stroke-width: 1; }
      .chip  { fill: var(--d-band);  stroke: var(--d-line); stroke-width: 1; }
      .ln    { stroke: var(--d-line);  stroke-width: 1.5; fill: none; }
      .ac    { stroke: var(--d-brand); stroke-width: 2; fill: none; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--d-line)"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--d-brand)"/>
    </marker>
  </defs>
  <rect class="_svg-bg" x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <text class="h" x="24" y="34">数据包工作流：四个阶段循环</text>
  <text class="m" x="24" y="56">编写 → 校验 → 部署 → 回滚，回滚后重新进入编写</text>
  <rect class="box" x="24" y="84" width="776" height="104" rx="10"/>
  <circle cx="72" cy="136" r="15" fill="var(--d-brand)" fill-opacity="0.12" stroke="var(--d-brand)" stroke-width="1"/>
  <text class="n" x="72" y="141" text-anchor="middle">1</text>
  <text class="h" x="118" y="128">编写</text>
  <text class="d" x="118" y="152">按需求选择内容类型，写清归属与命名空间</text>
  <rect class="chip" x="466.0" y="122" width="49.0" height="30" rx="6"/>
  <text class="d" x="490.5" y="142" text-anchor="middle">函数</text>
  <rect class="chip" x="525.0" y="122" width="74.0" height="30" rx="6"/>
  <text class="d" x="562.0" y="142" text-anchor="middle">战利品表</text>
  <rect class="chip" x="609.0" y="122" width="49.0" height="30" rx="6"/>
  <text class="d" x="633.5" y="142" text-anchor="middle">配方</text>
  <rect class="chip" x="668.0" y="122" width="49.0" height="30" rx="6"/>
  <text class="d" x="692.5" y="142" text-anchor="middle">生物</text>
  <rect class="chip" x="727.0" y="122" width="49.0" height="30" rx="6"/>
  <text class="d" x="751.5" y="142" text-anchor="middle">结构</text>
  <rect class="box" x="24" y="220" width="776" height="104" rx="10"/>
  <circle cx="72" cy="272" r="15" fill="var(--d-brand)" fill-opacity="0.12" stroke="var(--d-brand)" stroke-width="1"/>
  <text class="n" x="72" y="277" text-anchor="middle">2</text>
  <text class="h" x="118" y="264">校验</text>
  <text class="d" x="118" y="288">先小批验证，再看整体是否通过</text>
  <rect class="chip" x="553.0" y="258" width="70.375" height="30" rx="6"/>
  <text class="d" x="588.1875" y="278" text-anchor="middle">/reload</text>
  <rect class="chip" x="633.375" y="258" width="83.625" height="30" rx="6"/>
  <text class="d" x="675.1875" y="278" text-anchor="middle">/function</text>
  <rect class="chip" x="727.0" y="258" width="49.0" height="30" rx="6"/>
  <text class="d" x="751.5" y="278" text-anchor="middle">日志</text>
  <rect class="box" x="24" y="356" width="776" height="104" rx="10"/>
  <circle cx="72" cy="408" r="15" fill="var(--d-brand)" fill-opacity="0.12" stroke="var(--d-brand)" stroke-width="1"/>
  <text class="n" x="72" y="413" text-anchor="middle">3</text>
  <text class="h" x="118" y="400">部署</text>
  <text class="d" x="118" y="424">放进 datapacks/ 并锁定服务端版本</text>
  <rect class="chip" x="601.75" y="394" width="90.25" height="30" rx="6"/>
  <text class="d" x="646.875" y="414" text-anchor="middle">datapacks/</text>
  <rect class="chip" x="702.0" y="394" width="74.0" height="30" rx="6"/>
  <text class="d" x="739.0" y="414" text-anchor="middle">版本锁定</text>
  <rect class="box" x="24" y="492" width="776" height="104" rx="10"/>
  <circle cx="72" cy="544" r="15" fill="var(--d-brand)" fill-opacity="0.12" stroke="var(--d-brand)" stroke-width="1"/>
  <text class="n" x="72" y="549" text-anchor="middle">4</text>
  <text class="h" x="118" y="536">回滚</text>
  <text class="d" x="118" y="560">保留上一版可加载包，异常时快速切回</text>
  <rect class="chip" x="664.5" y="530" width="111.5" height="30" rx="6"/>
  <text class="d" x="720.25" y="550" text-anchor="middle">上一版可加载包</text>
  <line class="ln" x1="72" y1="188" x2="72" y2="220" marker-end="url(#ar)"/>
  <line class="ln" x1="72" y1="324" x2="72" y2="356" marker-end="url(#ar)"/>
  <line class="ln" x1="72" y1="460" x2="72" y2="492" marker-end="url(#ar)"/>
  <path class="ac" d="M 802,544 H 846 Q 872,544 872,518 V 162 Q 872,136 846,136 H 800" marker-end="url(#arb)" stroke-dasharray="7 6"/>
  <text class="a" x="846" y="124" text-anchor="middle">异常时回到编写</text>
</svg>
