# MiragEdge-DocWeb README 配图规格（github-readme-anime 技能生成）
#
# 风格：**暗色科技**（近黑墨蓝 + 品牌红单点强调 + 冷青辅助）
# 二次元素材只做**背景装饰**：角色立绘单色化、大幅淡化、边缘溶解，作为背景纹理出现，
#   不占视觉主体、不做角色卡墙 —— 这是代码仓库，读者要的是信息与质感。
#
# 重新生成：
#   python ~/.dsh/skills/github-readme-anime/scripts/readme_build.py assets/spec.yml --assets-only --out-dir .
#
# 图片以 jsDelivr 绝对地址引用（原因见文件末尾注释）
