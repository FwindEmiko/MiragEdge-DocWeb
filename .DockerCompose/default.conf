# miragedge.top 的配置
server {
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_static on;

    listen 80;
    server_name miragedge.top;
    index index.html;

    # 所有未单独处理 location 的 404/403 统一内部重定向到 /404.html（=404 保持 404 状态码）
    # /404.html 自身 no-store（见下方 location = /404.html），保证 404 响应不被 ESA 边缘缓存
    error_page 404 =404 /404.html;
    error_page 403 =404 /404.html;

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "OK";
    }

    # 版本探测文件：前端 useVersionCheck 以 no-store 拉取，源站与 ESA 均禁止缓存
    # 这是 ESA 场景下"快速发现新部署"的关键，必须始终回源
    # ──────────────────────────────────────
    location = /version.json {
        root /web_miragedge;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires off;
        access_log off;
        try_files $uri =404;
    }

    # ════════════════════════════════════════════════════════════════
    # 永不缓存（no-store）—— ESA 边缘缓存兼容
    #
    # 阿里云 ESA 官方规则：当源站响应带 Cache-Control: no-store（或 no-cache/max-age=0）
    # 时，ESA 节点直接 BYPASS 透传、不落缓存（前提：缓存规则为"优先遵循源站缓存策略"）。
    # 这些文件每次构建/部署都会更新，必须让 AI 抓取与玩家实时看到最新内容，
    # 避免部署后仍被边缘缓存命中旧版本（尤其 llms/ai-skills 供 AI 识别、日志与 TODO 数据）。
    # ════════════════════════════════════════════════════════════════

    # LLM / AI 识别索引：llms.txt 与 llms-full.txt（generate-llms.mjs 每次构建重新生成）
    location ~* /llms(?:-full)?\.txt$ {
        root /web_miragedge;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires off;
        access_log off;
        try_files $uri =404;
    }

    # AI 识别目录：AI Skills 技能包（skills.json / SKILL.md / 配置 / zip）
    location ^~ /ai-skills/ {
        root /web_miragedge;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires off;
        access_log off;
        try_files $uri =404;
    }

    # 更新日志数据（ChangelogFromMd 组件 fetch /logsdata.md）
    # 以及各分区清洗版 Markdown（generate-llms.mjs 产物，供 AI 识别最新文档）
    location ~* \.md$ {
        root /web_miragedge;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires off;
        access_log off;
        try_files $uri =404;
    }

    # TODO / 贡献者等 JSON 数据（TodoList 组件 fetch /data/todo.json）
    location ^~ /data/ {
        root /web_miragedge;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires off;
        access_log off;
        try_files $uri =404;
    }

    # 服务器状态数据（NodeStatus / ServerStatus/json/stats.json 动态刷新）
    location ^~ /ServerStatus/ {
        root /web_miragedge;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires off;
        access_log off;
        try_files $uri =404;
    }

    # 404 页面本身：禁止 ESA 缓存 404 响应（部署窗口期或路由变更后不再出现"缓存 404"）
    location = /404.html {
        root /web_miragedge;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires off;
        try_files $uri =404;
    }

    # 带内容 hash 的构建资源：文件名含 [hash]，内容变更 hash 必变 → 可长期 immutable
    # VitePress 产物（js/css/字体）均在此目录
    # 使用 ^~ 前缀匹配，优先级高于正则，且更高效
    location ^~ /assets/ {
        root /web_miragedge;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
        try_files $uri =404;
    }

    # HTML 页面：短边缘缓存 + stale-while-revalidate
    # - s-maxage=60         :ESA 边缘缓存 60s（部署后最多 60s 内全节点收敛）
    # - max-age=0           :浏览器每次向 ESA 校验（走 ETag/304，不重复下载）
    # - stale-while-revalidate=60:ESA 在回源刷新期间可返回旧副本，用户零等待
    location ~* \.html$ {
        root /web_miragedge;
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=60" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # 根路径与其他静态资源
    location / {
        root /web_miragedge;
        try_files $uri $uri.html $uri/ =404;

        # public/ 下无 hash 资源（图片/favicon/字体/manifest）：中等缓存，避免长期陈旧
        # 前端 useVersionCheck 检测到新版本时会 reload，作为兜底
        location ~* \.(?:png|jpe?g|gif|webp|ico|svg|woff2?|ttf|eot|webmanifest)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            access_log off;
            try_files $uri =404;
        }
    }

    # 安全响应头（作用于所有未在 location 内显式 add_header 的响应）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

