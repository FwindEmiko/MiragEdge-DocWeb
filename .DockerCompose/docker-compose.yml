services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5173}:80"
    volumes:
      # 静态站点目录
      - .././build/miragedge.top:/web_miragedge:ro
      # Nginx 配置文件
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - miragedge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------- MariaDB 服务 ----------
  # FwindEmiko-Web 通过 miragedge-network 共享此数据库
  db:
    image: mariadb:10.11
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: fwindemiko
      MYSQL_USER: fwindemiko
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - /www/MiragEdge/mysql:/var/lib/mysql
    networks:
      - miragedge-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  miragedge-network:
    external: true
