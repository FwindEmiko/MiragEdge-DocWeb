name: CI/CD 持续集成

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.x

jobs:
  # ============================================================
  # 代码质量检查（所有事件）
  # ============================================================
  lint:
    name: 代码质量检查
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # actions 全部固定到 commit SHA（供应链安全），注释标注对应版本
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - name: 类型检查
        run: pnpm run typecheck
        continue-on-error: false

  # ============================================================
  # 构建测试（main push 和 PR 事件）+ 安全门禁
  # ============================================================
  test:
    name: 测试与构建
    runs-on: ubuntu-22.04
    needs: lint
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - name: 单元测试
        run: pnpm run test
        continue-on-error: false
      # ---------- 安全门禁：密钥泄露扫描 ----------
      - name: 密钥泄露扫描 (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      # ---------- 安全门禁：依赖漏洞扫描 ----------
      - name: 依赖漏洞扫描 (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            .
      - name: 构建
        run: pnpm run build
      - name: 检查构建产物大小
        run: |
          DIST_SIZE=$(du -sh .vitepress/dist | cut -f1)
          echo "📦 构建产物大小: $DIST_SIZE"
          echo "## 构建产物大小: $DIST_SIZE" >> $GITHUB_STEP_SUMMARY
      - name: 打包
        run: tar -czf site.tar.gz -C .vitepress/dist .
      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: site.tar.gz
          retention-days: 3

  # ============================================================
  # 部署到 ECS（仅 main push，依赖 test 成功）
  # ============================================================
  deploy:
    name: 部署远端服务器
    runs-on: ubuntu-22.04
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 60
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: ./
      - name: 配置 SSH
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: 校验服务器 SSH 指纹并部署
        run: |
          set -e
          HOST="dev.miragedge.top"
          mkdir -p ~/.ssh
          # 1) 获取主机公钥并写入 known_hosts
          ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          # 2) 输出指纹，首次请人工核验（ssh-keyscan -H "$HOST" | ssh-keygen -lf -）
          #    并把期望指纹填入 secrets.DEV_HOST_SSH_FINGERPRINT，之后每次部署强制比对
          echo ">>> 服务器指纹："
          ssh-keygen -lf ~/.ssh/known_hosts 2>/dev/null || true
          EXPECTED_FP="${{ secrets.DEV_HOST_SSH_FINGERPRINT }}"
          if [ -n "$EXPECTED_FP" ]; then
            if ! ssh-keygen -lf ~/.ssh/known_hosts 2>/dev/null | grep -q "$EXPECTED_FP"; then
              echo "❌ SSH 主机指纹校验失败，终止部署（中间人风险）"
              exit 1
            fi
            echo "✅ SSH 主机指纹校验通过"
          else
            echo "⚠️ 未配置 DEV_HOST_SSH_FINGERPRINT，跳过指纹强校验（建议配置）"
          fi
          # 3) StrictHostKeyChecking=yes：任何密钥变更立即失败（fail-closed）
          scp -o StrictHostKeyChecking=yes -o ConnectTimeout=60 site.tar.gz root@"$HOST":/tmp/
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=60 root@"$HOST" << 'ENDSSH'
            set -e
            # ════════════════════════════════════════════════════════════
            # 原子化部署——修复 ESA 边缘缓存 404 问题的关键
            #
            # 旧方案 rm -rf <目标>/* 后 tar 解包，存在"整个目录为空"的窗口期：
            # 期间 ESA 边缘节点回源任意页面都会得到 404，并可能被 ESA 缓存，
            # 导致玩家看到没改过的页面也 404，必须手动刷新全站 ESA 缓存才恢复。
            #
            # 新方案：先完整解压到 staging，再同步到正式目录（目录永不整体清空），
            # 每份文件都是"先写新、后删旧"，回源始终能拿到内容。
            # ════════════════════════════════════════════════════════════
            DEST="/www/MiragEdge/MiragEdge-DocWeb/build/miragedge.top"
            STAGE="/www/MiragEdge/MiragEdge-DocWeb/build/.site-stage"
            mkdir -p "$DEST"
            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            tar -xzf /tmp/site.tar.gz -C "$STAGE"
            if command -v rsync >/dev/null 2>&1; then
              # rsync --delete：删除已移除的旧文件，同时全程保持目录非空
              rsync -a --delete "$STAGE/" "$DEST/"
            else
              # 无 rsync 兜底：cp 覆盖（旧文件残留无害，安全优先）
              cp -a "$STAGE"/. "$DEST"/
            fi
            rm -rf "$STAGE"
            rm -f /tmp/site.tar.gz
            echo "✅ 部署成功（原子化，无空目录窗口期）"
          ENDSSH

  # ============================================================
  # 构建预览
  # ============================================================
  preview-build:
    name: Dev预览测试构建
    runs-on: ubuntu-22.04
    needs: lint
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - name: 构建 GitHub Pages 预览
        run: pnpm run build
        env:
          VITEPRESS_BASE: /MiragEdge-DocWeb/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .vitepress/dist

  # ============================================================
  # 部署到 GitHub Pages
  # ============================================================
  deploy-pages:
    name: 部署到 GH Pages完成预览部署
    runs-on: ubuntu-22.04
    needs: preview-build
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
